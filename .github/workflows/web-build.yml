name: MultiCraft WebAssembly Test

on:
  workflow_dispatch:

jobs:
  wasm-test:
    name: "WebAssembly Build Test"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Check Emscripten
        run: |
          emcc --version
          
      - name: Build SQLite for WebAssembly
        run: |
          git clone -b version-3.51.1 --depth 1 https://github.com/sqlite/sqlite.git sqlite-src
          cd sqlite-src
          emconfigure ./configure \
            --enable-static \
            --disable-shared
          emmake make -j$(nproc)
          cd ..
          mkdir -p sqlite/include sqlite/lib
          cp sqlite-src/sqlite3.h sqlite/include/
          cp sqlite-src/sqlite3ext.h sqlite/include/
          cp sqlite-src/.libs/libsqlite3.a sqlite/lib/

      - name: Configure
        run: |
          emcmake cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_SERVER=FALSE \
            -DENABLE_SOUND=0 \
            -DSQLITE3_LIBRARY="$GITHUB_WORKSPACE/sqlite/lib/libsqlite3.a" \
            -DSQLITE3_INCLUDE_DIR="$GITHUB_WORKSPACE/sqlite/include"

      - name: Build
        run: |
          cmake --build build --parallel
